[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"

[workspace.dependencies]
kashika-diag = { path = "crates/kashika-diag" }
kashika-geom = { path = "crates/kashika-geom" }
kashika-syntax = { path = "crates/kashika-syntax" }
kashika-text = { path = "crates/kashika-text" }
kashika-model = { path = "crates/kashika-model" }
kashika-render = { path = "crates/kashika-render" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
clap = { version = "4", features = ["derive"] }
sha2 = "0.10"
insta = "1"
assert_cmd = "2"
predicates = "3"
tempfile = "3"
ttf-parser = "0.25"
