[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"

[workspace.dependencies]
kashika-diag = { path = "crates/kashika-diag" }
kashika-geom = { path = "crates/kashika-geom" }
kashika-syntax = { path = "crates/kashika-syntax" }
kashika-text = { path = "crates/kashika-text" }
kashika-model = { path = "crates/kashika-model" }
kashika-check = { path = "crates/kashika-check" }
kashika-render = { path = "crates/kashika-render" }
kashika-route = { path = "crates/kashika-route" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
clap = { version = "4", features = ["derive"] }
sha2 = "0.10"
insta = "1"
libtest-mimic = "0.8"
similar = "2"
assert_cmd = "2"
predicates = "3"
tempfile = "3"
skrifa = "0.44"
resvg = { version = "=0.45.1", default-features = false, features = ["raster-images"] }
usvg = { version = "=0.45.1", default-features = false, features = ["text"] }
jpeg-encoder = { version = "=0.7.1", default-features = false, features = ["std"] }
image-webp = { version = "=0.2.4", default-features = false }
imagesize = "=0.13.0"
base64 = "=0.22.1"
