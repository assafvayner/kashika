[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.package]
version = "0.1.0-dev0"
edition = "2021"
rust-version = "1.89"
license = "Apache-2.0"
repository = "https://github.com/assafvayner/kashika"
homepage = "https://github.com/assafvayner/kashika"
keywords = ["kashika", "diagram", "svg", "dsl", "ai-agents"]

[workspace.dependencies]
kashika-diag = { path = "crates/kashika-diag", version = "=0.1.0-dev0" }
kashika-geom = { path = "crates/kashika-geom", version = "=0.1.0-dev0" }
kashika-syntax = { path = "crates/kashika-syntax", version = "=0.1.0-dev0" }
kashika-text = { path = "crates/kashika-text", version = "=0.1.0-dev0" }
kashika-model = { path = "crates/kashika-model", version = "=0.1.0-dev0" }
kashika-check = { path = "crates/kashika-check", version = "=0.1.0-dev0" }
kashika-render = { path = "crates/kashika-render", version = "=0.1.0-dev0" }
kashika-route = { path = "crates/kashika-route", version = "=0.1.0-dev0" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
clap = { version = "4", features = ["derive"] }
sha2 = "0.10"
insta = "1"
libtest-mimic = "0.8"
similar = "2"
assert_cmd = "2"
predicates = "3"
tempfile = "3"
skrifa = "0.44"
rustybuzz = "=0.20.1"
resvg = { version = "=0.45.1", default-features = false, features = ["raster-images"] }
usvg = { version = "=0.45.1", default-features = false, features = ["text"] }
jpeg-encoder = { version = "=0.7.1", default-features = false, features = ["std"] }
image-webp = { version = "=0.2.4", default-features = false }
imagesize = "=0.13.0"
base64 = "=0.22.1"
