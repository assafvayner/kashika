[package]
name = "kashika"
version.workspace = true
edition.workspace = true
description = "A text-to-diagram language for technical designs: check and render .kash files to SVG, with no auto-layout"
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
readme = "../../README.md"
keywords = ["diagram", "svg", "dsl", "cli", "ai-agents"]
categories = ["command-line-utilities", "visualization", "rendering"]
include = ["src/**/*", "ref/*", "LICENSE"]

[[bin]]
name = "kashika"
path = "src/main.rs"

[dependencies]
kashika-check.workspace = true
kashika-diag.workspace = true
kashika-geom.workspace = true
kashika-model.workspace = true
kashika-render.workspace = true
kashika-route.workspace = true
kashika-text.workspace = true
kashika-syntax.workspace = true
clap.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true

[dev-dependencies]
assert_cmd.workspace = true
predicates.workspace = true
tempfile.workspace = true
serde_json.workspace = true
libtest-mimic.workspace = true
similar.workspace = true
base64.workspace = true

[[test]]
name = "golden"
path = "tests/golden/main.rs"
harness = false
